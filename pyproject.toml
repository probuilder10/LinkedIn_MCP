[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "Open-source LinkedIn MCP server: prospecting, outreach, posts, signals, ICP scoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LinkedIn MCP" }]
dependencies = [
    "mcp[cli]>=1.2.0",
    "linkedin-api>=2.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2",
    "apscheduler>=3.10",
    "rapidfuzz>=3.6",
    "openai>=1.30",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
